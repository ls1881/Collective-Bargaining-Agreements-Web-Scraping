# MLX (Apple Silicon) equivalent of qlora_extract.yaml — runs locally on the M3 Max.
base_model: mlx-community/Qwen2.5-7B-Instruct-4bit
adapter_out: adapters/extract-lora-mlx
labels_path: data/extract_labels.jsonl
schema_path: schema.json

system_prompt: >
  You extract structured data from Italian Collective Bargaining Agreements
  (CCNL) into strict JSON matching the given schema. Only extract values
  explicitly stated in the text; set null (or empty array) when a field is
  not present. Never guess or infer typical values. Output only valid JSON.

# Same measured value as qlora_extract.yaml (5174 tokens worst case + headroom).
max_seq_length: 6144

lora:
  rank: 16
  dropout: 0.05
  scale: 20.0
  num_layers: 16

train:
  batch_size: 2
  num_epochs: 15
  # Same fix as qlora_clean_mlx.yaml — see that file's comment. mlx-lm's own default (1e-5)
  # matched to its scale=20.0 LoRA convention, not the CUDA config's 2e-4.
  learning_rate: 1.0e-5
  steps_per_report: 1
  steps_per_eval: 5
  grad_checkpoint: true
  grad_accumulation_steps: 2
  early_stopping_patience: 10

split:
  val_fraction: 0.10
  test_fraction: 0.10
  split_key: doc_id
  stratify_key: null
  seed: 42
