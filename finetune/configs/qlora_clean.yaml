# Hyperparameters below are sized for the current hand-labeled dataset (~100 docs / 110
# chunk-level examples, produced via chat_sample.py + manual labeling, not the original
# plan's 750-doc automated distillation). Revisit eval_steps/save_steps/epochs and LoRA
# rank if the dataset is later scaled up (e.g. via distill_labels.py with an API key).
base_model: Qwen/Qwen2.5-7B-Instruct
adapter_out: adapters/clean-lora
labels_path: data/clean_labels.jsonl

system_prompt: >
  You are an expert editor of Italian legal and labor-law documents (CCNL).
  Correct OCR errors, preserve meaning and legal terminology exactly, and
  mark unrecoverable spans as [ILLEGIBLE]. Output only the corrected text.

# Measured against the actual labeled dataset with the real Qwen2.5 tokenizer: worst-case
# formatted example (system+user+assistant) is 2186 tokens (doc 14389, chunk 3). 2048 would
# silently truncate that example's target. Set with headroom above the measured max.
max_seq_length: 2560

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quant:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 15
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 5
  save_strategy: steps
  save_steps: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  logging_steps: 1
  seed: 42

split:
  val_fraction: 0.10
  test_fraction: 0.10
  split_key: doc_id
  stratify_key: quality_bin
  seed: 42
