# Hyperparameters below are sized for the current hand-labeled dataset (60 short/medium
# docs, produced via chat_sample.py + manual labeling, not the original plan's 750-doc
# automated distillation). Revisit eval_steps/save_steps/epochs and LoRA rank if the
# dataset is later scaled up (e.g. via distill_labels.py with an API key).
base_model: Qwen/Qwen2.5-7B-Instruct
adapter_out: adapters/extract-lora
labels_path: data/extract_labels.jsonl
schema_path: schema.json

system_prompt: >
  You extract structured data from Italian Collective Bargaining Agreements
  (CCNL) into strict JSON matching the given schema. Only extract values
  explicitly stated in the text; set null (or empty array) when a field is
  not present. Never guess or infer typical values. Output only valid JSON.

max_seq_length: 3072

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quant:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 15
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 5
  save_strategy: steps
  save_steps: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  logging_steps: 1
  seed: 42

split:
  val_fraction: 0.10
  test_fraction: 0.10
  split_key: doc_id
  stratify_key: null
  seed: 42
